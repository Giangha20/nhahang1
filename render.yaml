services:
  - type: web
    name: quan-ngon
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/restaurant.sqlite
    disk:
      name: quan-ngon-data
      mountPath: /var/data
      sizeGB: 1
